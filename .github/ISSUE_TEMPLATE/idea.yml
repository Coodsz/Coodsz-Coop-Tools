name: Idea
description: Something new for one of the Coodsz tools, or a way to make one easier to use.
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This repo is public, so everyone can read what you write here.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Coop Server Tool
        - Coop Client Launcher (Coop and Friends)
        - TAOM tools
        - AD1259 tools
        - Burning Empires tools
        - Realm of Thrones tools
        - All of them
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you'd like the tool to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What it makes easier for you, your players or your server.
